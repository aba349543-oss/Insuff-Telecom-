 return'<div class="bc"><button onclick="back()">← পেছনে</button></div><div class="card"><h2 style="margin:0">অর্ডারের তথ্য</h2><label>আপনার নাম *</label><input value="'+esc(ci.n)+'" oninput="ci.n=this.value"><label>মোবাইল নম্বর *</label><input type="tel" inputmode="tel" value="'+esc(ci.p)+'" oninput="ci.p=this.value"><label>ঠিকানা (ডেলিভারির জন্য)</label><input value="'+esc(ci.a)+'" oninput="ci.a=this.value"><label>নেওয়ার ধরন</label><select onchange="ci.d=this.value"><option'+(ci.d=="হোম ডেলিভারি"?" selected":"")+'>হোম ডেলিভারি</option><option'+(ci.d=="দোকান থেকে নেব"?" selected":"")+'>দোকান থেকে নেব</option></select><div class="tot"><span>মোট ('+cnt()+' টি)</span><span>৳'+sum()+'</span></div><button class="btn" onclick="place()">অর্ডার কনফার্ম করুন</button></div>';
}
function place(){
 if(!ci.n.trim()||ci.p.replace(/\D/g,"").length<11){alert("নাম ও সঠিক মোবাইল নম্বর দিন");return}
 if(ci.d=="হোম ডেলিভারি"&&!ci.a.trim()){alert("ডেলিভারির ঠিকানা দিন");return}
 var no=Math.floor(1000+Math.random()*9000);
 var t="নতুন অর্ডার #"+no+" – "+SHOP+"\nনাম: "+ci.n+"\nফোন: "+ci.p+"\n"+ci.d+(ci.a?"\nঠিকানা: "+ci.a:"")+"\n\n"+cart.map(function(c,i){return(i+1)+". "+c.name+" × "+c.qty+" = ৳"+c.price*c.qty}).join("\n")+"\n\nমোট: ৳"+sum();
 ord={no:no,t:t,sent:false};
 if(!WA_KEY){show("done");return}
 var bt=document.querySelector(".btn");if(bt){bt.disabled=true;bt.textContent="পাঠানো হচ্ছে..."}
 var pl=JSON.stringify({no:no,name:ci.n,phone:ci.p,address:ci.a,delivery:ci.d,items:cart.map(function(c){return c.name+" × "+c.qty+" = ৳"+c.price*c.qty}).join("\n"),total:sum()});
 fetch("https://api.callmebot.com/whatsapp.php?phone=%2B"+WA+"&text="+encodeURIComponent(t)+"&apikey="+WA_KEY,{mode:"no-cors"}).then(function(){ord.sent=true;cart=[];sv();show("done")}).catch(function(){alert("ইন্টারনেট সমস্যা, আবার চেষ্টা করুন");draw()});
}
function vDone(){
 var e=encodeURIComponent(ord.t);
 return'<div class="card"><div class="big">✅</div><h2 style="text-align:center;margin:0">অর্ডার #'+ord.no+(ord.sent?' সম্পন্ন হয়েছে ✓':' তৈরি হয়েছে')+'</h2>'+(ord.sent?'<p class="mu" style="text-align:center">আপনার অর্ডার আমাদের কাছে পৌঁছে গেছে। শীঘ্রই ফোনে যোগাযোগ করা হবে। ধন্যবাদ!</p>':'<p class="mu" style="text-align:center">অর্ডারটি আমাদের কাছে পৌঁছে দিতে নিচের বোতামে চাপ দিয়ে পাঠিয়ে দিন।</p>')+'<pre style="white-space:pre-wrap;font:inherit;font-size:14px;background:var(--bg);padding:12px;border-radius:10px">'+esc(ord.t)+'</pre>'+(ord.sent?'':'<a class="btn" href="https://wa.me/'+WA+'?text='+e+'" target="_blank" rel="noopener">💬 WhatsApp-এ অর্ডার পাঠান</a><a class="btn s" href="sms:'+PH+'?body='+e+'">✉️ SMS-এ পাঠান</a>')+'<a class="btn s" href="tel:'+PH+'">📞 কল করে অর্ডার করুন</a><button class="btn s" onclick="cart=[];sv();ord=null;home()">হোমে ফিরুন (কার্ট খালি হবে)</button></div>';
}
draw();
</script></body></html>
