function st(t){var e=$("st");if(e)e.textContent=t}
function vS(){
 var g=["aba349543-oss","Insuff-Telecom-",""];try{var s=JSON.parse(localStorage.getItem("adm_gh"));if(s)g=s}catch(e){}
 return'<div class="c"><h2>🚀 সরাসরি ওয়েবসাইটে পাঠান</h2><p class="mu">GitHub token দিলে এক চাপেই দাম ও মডেল ওয়েবসাইটে চলে যাবে। token কাউকে দেবেন না।</p><label class="mu">GitHub ইউজারনেম</label><input id="go" value="'+esc(g[0])+'"><label class="mu">রিপোজিটরির নাম</label><input id="gr" value="'+esc(g[1])+'"><label class="mu">Token</label><input id="gt" type="password" value="'+esc(g[2])+'"><button class="b" onclick="pub()">✅ ওয়েবসাইটে লাইভ করুন</button><div id="st"></div></div>'
 +'<div class="c"><h2>ফাইল দিয়ে (token ছাড়া)</h2><p class="mu">ফাইল নামিয়ে GitHub-এ catalog.json নামে আপলোড করুন।</p><button class="b s" onclick="dl()">⬇️ catalog.json নামান</button><button class="b s" onclick="if(confirm(\'সব অসমাপ্ত বদল মুছে লাইভ ডেটা আনবেন?\')){try{localStorage.removeItem(\'adm_d\')}catch(e){}location.reload()}">↺ বদল মুছে শুরু থেকে</button></div>';
}
function dl(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:"application/json"}));a.download="catalog.json";document.body.appendChild(a);a.click();a.remove()}
async function pub(){
 var o=$("go").value.trim(),r=$("gr").value.trim(),t=$("gt").value.trim();
 if(!o||!r||!t){st("সব ঘর পূরণ করুন");return}
 try{localStorage.setItem("adm_gh",JSON.stringify([o,r,t]))}catch(e){}
 var u="https://api.github.com/repos/"+o+"/"+r+"/contents/catalog.json",h={Authorization:"Bearer "+t,Accept:"application/vnd.github+json"},sha;
 st("পাঠানো হচ্ছে...");
 try{
  var g=await fetch(u,{headers:h});
  if(g.ok)sha=(await g.json()).sha;else if(g.status!=404){st("ত্রুটি "+g.status+": token বা নাম ঠিক আছে কি দেখুন");return}
  var body={message:"catalog update",content:btoa(unescape(encodeURIComponent(JSON.stringify(D))))};
  if(sha)body.sha=sha;
  var p=await fetch(u,{method:"PUT",headers:h,body:JSON.stringify(body)});
  if(p.ok){try{localStorage.removeItem("adm_d")}catch(e){}st("✅ সেভ হয়েছে! কয়েক মিনিটের মধ্যে ওয়েবসাইটে আসবে।")}
  else st("ত্রুটি "+p.status+": token-এ Contents → Read and write অনুমতি আছে কি দেখুন")
 }catch(e){st("ইন্টারনেট সমস্যা, আবার চেষ্টা করুন")}
}
draw();
